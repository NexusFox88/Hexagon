<!doctype html>
<html lang="en" data-i18n-pending><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><link rel="preload" as="image" href="/console/brand/hexagon-loading-light.svg"><link rel="preload" as="image" href="/console/brand/hexagon-loading-dark.svg"><link rel="preload" as="image" href="/console/brand/hexagon-loading-pulse-light.svg"><link rel="preload" as="image" href="/console/brand/hexagon-loading-pulse-dark.svg"><script src="/console/theme.js"></script><title data-i18n="ui.hexagon_sandbox_connections"></title><link rel="stylesheet" href="/console/style.css"><script type="module" src="/console/app.js"></script><link rel="stylesheet" href="/console/layout.css"><link rel="stylesheet" href="/console/scroll-layout.css">
<link rel="stylesheet" href="/console/surfaces.css"><link rel="stylesheet" href="/console/session-detail.css"><link rel="stylesheet" href="/console/page-layout.css"><link rel="stylesheet" href="/console/theme.css"><link rel="stylesheet" href="/console/design-system.css"></head>
<body>
<div id="app-shell">

  <div class="workspace-name"><span class="avatar">H</span><span><span data-i18n="ui.personal_workspace"></span><small><span data-i18n="ui.agent_control_plane"></span></small></span></div>
  <button id="navigation-toggle" class="navigation-toggle" aria-expanded="false" aria-controls="main-navigation"><span data-i18n="ui.journey_navigation"></span></button>
  <nav id="main-navigation" data-i18n-aria-label="ui.main_navigation" aria-label="">

    <a href="#sessions" data-view="sessions"><span data-icon="activity"></span><span data-i18n="ui.sessions"></span></a>
    <a href="#runtime" data-view="runtime"><span data-icon="box"></span><span data-i18n="ui.simple_runtime"></span></a>
    <div class="infrastructure-children"><a href="#sandboxes" data-view="sandboxes"><span data-i18n="ui.dense_sandbox"></span></a><a href="#models" data-view="models"><span data-i18n="ui.dense_llm"></span></a><a href="#harnesses" data-view="harnesses"><span data-i18n="ui.harnesses"></span></a><a href="#secrets" data-view="secrets"><span data-i18n="ui.credentials_secrets"></span></a><a href="#http" data-view="http"><span data-i18n="ui.protected_apis"></span></a></div>
    <a href="#tools" data-view="tools"><span data-icon="tool"></span><span data-i18n="ui.simple_tool_connections"></span></a>
  </nav>
  <div class="rail-settings">
    <button id="preferences-toggle" class="ghost" aria-expanded="false" aria-controls="preferences-panel"><span data-i18n="ui.simple_settings"></span><span aria-hidden="true">⌃</span></button>
    <div id="preferences-panel" hidden>
  <div class="rail-preferences"><div id="rail-locale" class="rail-locale"><span data-i18n="ui.language"></span><hx-select id="locale" data-i18n-aria-label="ui.language" aria-label=""></hx-select></div><div id="rail-theme"><span data-i18n="ui.theme"></span><hx-select id="theme" data-i18n-aria-label="ui.theme"></hx-select></div></div>
      <a class="settings-entry" href="#settings" data-view="settings"><span data-i18n="ui.simple_settings"></span><span aria-hidden="true">→</span></a>
    </div>
  </div>
  <div class="rail-bottom"><div class="connection-indicator"><span class="dot" aria-hidden="true"></span><span id="connection-state"><span data-i18n="ui.not_connected"></span></span></div><button id="logout" class="ghost" hidden><span data-i18n="ui.disconnect_console"></span><span aria-hidden="true">↗</span></button></div>
</aside>
<main>

  <div class="page-body">
  <div id="notice" role="status" aria-live="polite" hidden></div>
  <section id="login"><div id="login-preferences"><div id="login-locale"></div><div id="login-theme"></div></div><div class="login-copy"><span class="section-tag"><span data-i18n="ui.workspace_access"></span></span><h1><span data-i18n="ui.connect_to_your_workspace"></span></h1><p class="lead"><span data-i18n="ui.configure_execution_environments_and_agent_integrations_here"></span><br><span data-i18n="ui.start_running_through_the_api_and_sdk"></span></p></div><form id="login-form" class="login-panel" novalidate><h2><span data-i18n="ui.connect_to_the_control_plane"></span></h2><p class="hint"><span data-i18n="ui.walk_token_help"></span></p><label for="api-token"><span data-i18n="ui.api_token"></span></label><input id="api-token" type="password" autocomplete="off" required data-i18n-placeholder="ui.enter_your_control_plane_api_token" placeholder=""><p class="hint"><span data-i18n="ui.find_your_token_in_the_local_data_directory"></span><code>owner.json</code><span data-i18n="ui.it_is_kept_only_in_this_page_s_memory"></span></p><button class="primary" type="submit"><span data-i18n="ui.connect_workspace"></span><span aria-hidden="true">→</span></button></form><p class="login-footnote"><span data-i18n="ui.local_control_cloud_execution"></span></p></section>
  <section id="workspace" hidden tabindex="-1">
    <div class="heading"><div><div id="breadcrumb-current" class="page-context"></div><div class="eyebrow" id="eyebrow"><span data-i18n="ui.platform_execution_environments"></span></div><div class="page-title-line"><a id="page-back" class="title-back" href="#sessions" hidden><svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m14 6-6 6 6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></a><h1 id="title"><span data-i18n="ui.sandbox_connections"></span></h1></div><p id="subtitle"><span data-i18n="ui.connect_cloud_sandboxes_used_by_the_platform_manage_provider_credentials"></span></p></div><div class="actions"><button id="refresh" data-i18n-aria-label="ui.refresh_data" aria-label=""><span data-icon="refresh"></span><span><span data-i18n="ui.refresh"></span></span></button><button id="create" class="primary"><span data-i18n="ui.add_sandbox"></span></button></div></div>
    <nav id="journey-path" class="journey-path" data-i18n-aria-label="ui.journey_path" aria-label=""></nav>
    <div class="section-tabs" data-i18n-aria-label="ui.current_page" aria-label=""><span class="selected" id="section-label"><span data-i18n="ui.provider_connections"></span></span><span class="scope-label" id="scope-label"><span data-i18n="ui.platform_infrastructure"></span></span></div>
    <div class="workspace-toolbar"><div class="search-field"><span data-icon="search"></span><input id="search" type="text" data-i18n-aria-label="ui.search_this_list" aria-label="" autocomplete="off" data-i18n-placeholder="ui.search_names_or_providers" placeholder=""><kbd>/</kbd></div><hx-select id="status-filter" data-i18n-aria-label="ui.filter_by_status" aria-label=""></hx-select></div>
    <div id="content"></div>
    <footer class="page-footer"><span>Hexagon <span class="footer-dot">·</span><span data-i18n="ui.control_plane"></span></span><span id="ingress-status" role="status"></span></footer>
  </section>
  </div>
</main>
</div>
<div id="editor" class="modal-layer" role="dialog" aria-modal="true" aria-labelledby="editor-title" hidden><div class="modal-panel"><form id="connection-form" novalidate>
  <div class="dialog-heading"><div><div class="eyebrow" id="editor-scope"><span data-i18n="ui.platform_sandbox"></span></div><h2 id="editor-title"><span data-i18n="ui.add_sandbox"></span></h2><p class="hint" id="editor-description"><span data-i18n="ui.configure_the_provider_and_credentials_for_your_cloud_environment"></span></p></div><button type="button" id="dismiss" class="icon-button" data-i18n-aria-label="ui.close_configuration" aria-label="">×</button></div>
  <div class="dialog-body"><div id="form-error" role="alert" class="inline-error" hidden></div><input id="kind" type="hidden" value="sandbox">
  <div id="provider-search-group"><label for="provider-search" data-i18n="ui.search_providers"></label><input id="provider-search" type="text" autocomplete="off" aria-controls="provider" aria-describedby="provider-search-help"><p id="provider-search-help" class="hint" data-i18n="ui.provider_search_help"></p><p id="provider-no-matches" class="hint" role="status" data-i18n="ui.no_provider_matches" hidden></p></div>
  <label for="provider"><span data-i18n="ui.provider"></span></label><hx-select id="provider" data-i18n-aria-label="ui.provider" aria-label=""></hx-select>
  <label for="name"><span data-i18n="ui.connection_name"></span><span class="required-mark">*</span></label><input id="name" required maxlength="200" autocomplete="off"  placeholder="">
  <div id="connection-auth-method"></div><div id="sandbox-credentials"></div><div id="sandbox-required"></div><div id="sandbox-setup"></div><details id="sandbox-advanced" open><summary data-i18n="ui.sandbox_advanced"></summary><div id="provider-fields"></div></details>
  <div class="form-section" id="connection-auth-heading"><h3><span data-i18n="ui.authentication"></span></h3><p class="hint"><span data-i18n="ui.credentials_are_encrypted_and_stored_in_the_control_plane"></span></p></div>
  <details id="sandbox-secret-choice" open><summary data-i18n="ui.sandbox_use_saved"></summary><label for="secret-reference"><span data-i18n="ui.credential_source"></span></label><hx-select id="secret-reference" data-i18n-aria-label="ui.credential_source" aria-label=""></hx-select></details>
  <label for="credential"><span data-i18n="ui.access_credentials"></span></label><input id="credential" type="password" autocomplete="new-password" data-i18n-placeholder="ui.enter_credentials_or_leave_blank_to_configure_later" placeholder=""><p id="credential-hint" class="hint"></p></div>
  <div class="dialog-footer"><span class="footer-help"><span data-i18n="ui.verify_and_enable_after_saving"></span></span><button type="button" id="cancel-edit"><span data-i18n="ui.cancel"></span></button><button class="primary" type="submit"><span data-i18n="ui.save_configuration"></span></button></div>
</form></div></div>
<div id="secret-editor" class="modal-layer" role="dialog" aria-modal="true" aria-labelledby="secret-title" hidden><div class="modal-panel"><form id="secret-form" novalidate>
  <div class="dialog-heading"><div><div class="eyebrow"><span data-i18n="ui.workspace_secrets"></span></div><h2 id="secret-title"><span data-i18n="ui.new_secret"></span></h2></div><button type="button" id="secret-dismiss" class="icon-button" data-i18n-aria-label="ui.close_secret_configuration" aria-label="">×</button></div>
  <div class="dialog-body"><div id="secret-error" class="inline-error" role="alert" hidden></div><p class="hint"><span data-i18n="ui.original_secret_values_are_not_sent_as_agent_environment_variables"></span></p><label for="secret-name"><span data-i18n="ui.name"></span><span class="required-mark">*</span></label><input id="secret-name" required maxlength="200" data-i18n-placeholder="ui.for_example_production_api_key" placeholder="" autocomplete="off"><label for="secret-value"><span data-i18n="ui.secret_value"></span></label><input id="secret-value" type="password" autocomplete="new-password" data-i18n-placeholder="ui.write_only_never_displayed_after_saving" placeholder=""></div>
  <div class="dialog-footer"><button id="secret-cancel" type="button"><span data-i18n="ui.cancel"></span></button><button class="primary" type="submit"><span data-i18n="ui.save_secret"></span></button></div>
</form></div></div>
<div id="confirmation" class="modal-layer" role="alertdialog" aria-modal="true" aria-labelledby="confirm-title" aria-describedby="confirm-description" hidden><div class="modal-panel compact"><div class="dialog-heading"><h2 id="confirm-title"><span data-i18n="ui.confirm_action"></span></h2></div><div class="dialog-body"><p id="confirm-description"></p></div><div class="dialog-footer"><button id="confirm-cancel" type="button"><span data-i18n="ui.cancel"></span></button><button id="confirm-accept" class="danger-primary" type="button"><span data-i18n="ui.confirm_and_continue"></span></button></div></div></div>
</body></html>
