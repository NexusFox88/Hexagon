<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hexagon acceptance · Task board</title><link rel="stylesheet" href="/style.css"><script type="module" src="/app.mjs"></script></head><body><header><strong>⬡ HEXAGON</strong><span>ACCEPTANCE-001 / LIVE WORKSPACE</span></header><main><p class="eyebrow">TEAM WORKSPACE</p><h1>让每一项工作，<br>都有清晰的进展。</h1><p class="intro">按名称与状态筛选任务，查看本次 agent 实现的结果。</p><form id="filters"><label>搜索任务<input id="query" placeholder="输入名称，例如 API" autocomplete="off"></label><label>任务状态<select id="status"><option value="all">全部状态</option><option value="open">进行中</option><option value="done">已完成</option></select></label><button type="submit">筛选任务 →</button></form><p id="count" role="status"></p><section id="items" aria-label="任务列表"></section><p id="empty" hidden>没有匹配的任务。请尝试其他搜索条件。</p><p id="error" role="alert" hidden></p></main></body></html>
