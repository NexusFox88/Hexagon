name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  deterministic:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hexagon
          POSTGRES_PASSWORD: hexagon_ci_only
          POSTGRES_DB: hexagon_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hexagon -d hexagon_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://hexagon:hexagon_ci_only@127.0.0.1:5432/hexagon_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'setuptools>=68' wheel
      - run: npm ci
      - run: npm run verify
      - run: npm run verify:packages
      - run: npm run release:check
      - run: npm run build:local -- "$RUNNER_TEMP/hexagon-release"
      - run: npm run release:check -- --artifact "$RUNNER_TEMP/hexagon-release"
      - run: npm ci --omit=dev --ignore-scripts
        working-directory: ${{ runner.temp }}/hexagon-release
      - run: npm run verify:startup
        env:
          DATABASE_URL: postgres://hexagon:hexagon_ci_only@127.0.0.1:5432/hexagon_test
          HEXAGON_TEST_RELEASE_ROOT: ${{ runner.temp }}/hexagon-release
          HEXAGON_ACCESS_TUNNEL: ''
# No cloud credentials, pull_request_target, uploads of private evidence, or publishing.
