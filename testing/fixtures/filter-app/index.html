<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hexagon acceptance · Task board</title><link rel="stylesheet" href="/style.css"><script type="module" src="/app.mjs"></script></head><body><header><strong>⬡ HEXAGON</strong><span>ACCEPTANCE-001 / LIVE WORKSPACE</span></header><main><p class="eyebrow">TEAM WORKSPACE</p><h1>Clear progress,<br>for every task.</h1><p class="intro">Filter tasks by name and status to inspect the agent implementation.</p><form id="filters"><label>Search tasks<input id="query" placeholder="Enter a name, such as API" autocomplete="off"></label><label>Task status<select id="status"><option value="all">All statuses</option><option value="open">In progress</option><option value="done">Done</option></select></label><button type="submit">Filter tasks →</button></form><p id="count" role="status"></p><section id="items" aria-label="Task list"></section><p id="empty" hidden>No matching tasks. Try different filters.</p><p id="error" role="alert" hidden></p></main></body></html>
